version: '3'

services:
  
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miphp
    restart: always
    extra_hosts:
        - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${MYSQL_HOST}
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - mired

  db:
    build:
      context: ./DAO
      dockerfile: Dockerfile
    container_name: mimysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data_proyecto:/var/lib/mysql
    networks:
      - mired

networks:
  mired:
    driver: bridge

volumes:
  db_data_proyecto:
